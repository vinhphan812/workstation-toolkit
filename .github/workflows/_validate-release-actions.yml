# TEMPORARY validation workflow. It exists to prove that the upgraded
# release-path actions work together in this repository. It creates a draft
# release, which is deleted afterwards, and it never publishes anything.
name: Validate release actions

on:
  push:
    branches: ["chore/actions-node24"]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build package
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Upload distribution artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workstation-toolkit-dist
          path: dist/
      - name: Download distribution artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: workstation-toolkit-dist
          path: dist/
      - name: Assert the artefact round-tripped
        run: |
          ls -l dist/
          test -f dist/workstation_toolkit-0.2.0-py3-none-any.whl
          test -f dist/workstation_toolkit-0.2.0.tar.gz
      - name: Create a draft release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          # Deliberately not a "v*" tag: the repository protects release tags,
          # and the workflow token cannot bypass that protection.
          tag_name: action-validation-${{ github.run_id }}
          name: action-validation
          draft: true
          files: dist/*
