[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workstation-toolkit"
version = "0.1.0"
description = "Cross-platform workstation diagnostic and maintenance toolkit"
requires-python = ">=3.10"
dependencies = [
  "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=7", "build>=1.2"]

[project.scripts]
workstation = "workstation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
